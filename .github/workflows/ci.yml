name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run pycodestyle
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycodestyle
          pycodestyle urbanaccess

  unit-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lower-bound dependencies
            python-version: "3.10"
            constraints: requirements-lower-bound.txt
          - name: Latest dependencies
            python-version: "3.11"
            constraints: ""
    env:
      CI: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.constraints }}" ]; then
            python -m pip install --constraint "${{ matrix.constraints }}" . pytest cartopy
          else
            python -m pip install . pytest cartopy
          fi
      - name: Show dependency versions
        run: python -m pip list
      - name: Run tests
        run: |
          python -m pip check
          python -m pytest -m "not network"

  package:
    name: Package build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install and import wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          cd /tmp
          python -c "import urbanaccess; print(urbanaccess.__version__)"

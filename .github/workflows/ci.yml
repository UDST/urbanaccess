name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      CI: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install maintenance baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements/ci.txt . pytest cartopy
      - name: Run deterministic tests
        run: |
          python -m pip check
          python -m pytest -m "not network"

  package:
    name: Package build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements/ci.txt build twine
          python -m build
          python -m twine check dist/*
      - name: Install and import wheel
        run: |
          python -m pip install --constraint requirements/ci.txt dist/*.whl
          python -m pip check
          cd /tmp
          python -c "import urbanaccess; print(urbanaccess.__version__)"
